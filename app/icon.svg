<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cinematic Dark Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="50%" stop-color="#0e1015" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- Vibrant Gold Metallic Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe169" />
      <stop offset="40%" stop-color="#f5c518" />
      <stop offset="100%" stop-color="#d49e05" />
    </linearGradient>

    <!-- Ambient Gold Glow -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="110" fill="none" stroke="#f5c518" stroke-width="6" stroke-opacity="0.3" />

  <!-- Clapperboard Top Slanted Arm -->
  <g filter="url(#gold-glow)">
    <g transform="translate(256, 170) rotate(-10) translate(-256, -170)">
      <!-- Clapper Top Bar Body -->
      <path d="M 120 136 L 392 136 C 404 136 414 146 414 158 L 414 186 C 414 198 404 208 392 208 L 120 208 C 108 208 98 198 98 186 L 98 158 C 98 146 108 136 120 136 Z" fill="url(#gold-grad)" />
      
      <!-- Alternating Stripes -->
      <polygon points="152,136 182,136 150,208 120,208" fill="#0e1015" />
      <polygon points="222,136 252,136 220,208 190,208" fill="#0e1015" />
      <polygon points="292,136 322,136 290,208 260,208" fill="#0e1015" />
      <polygon points="362,136 392,136 360,208 330,208" fill="#0e1015" />
    </g>

    <!-- Clapperboard Main Body Frame -->
    <rect x="108" y="222" width="296" height="188" rx="24" fill="none" stroke="url(#gold-grad)" stroke-width="20" stroke-linejoin="round" />

    <!-- Centered Movie Play Icon -->
    <path d="M 228 264 C 228 256 236 251 243 255 L 324 302 C 331 306 331 316 324 320 L 243 367 C 236 371 228 366 228 358 Z" fill="url(#gold-grad)" />
  </g>
</svg>
